name: Scrape menus

on:
  schedule:
    # GitHub cron is UTC: 04:17 in winter, 05:17 in summer in Europe/Berlin. Off the full hour, when runs queue longest.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Used only while the latest release of the app has no scraper/ yet: a commit of the app with the current CLI. Remove
  # once a release contains it.
  SCRAPER_FALLBACK_REF: 2fd924038e9789ac597488b7bf3318140877fc68

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit the data
      actions: write # keep this workflow enabled
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # GitHub disables scheduled workflows after 60 days without repository activity. See "Keeping the schedule alive"
      # in the README. First step, so it also happens on days the scrape fails.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/scrape.yml/enable" || echo "::warning::could not re-enable the workflow"

      - name: Find the app's latest release
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo Luwify/ovgu-mensa --json tagName --jq .tagName)
          if gh api "repos/Luwify/ovgu-mensa/contents/scraper/build.gradle.kts?ref=$tag" --silent; then
            ref=$tag
          else
            ref=$SCRAPER_FALLBACK_REF
            echo "::notice::release $tag has no scraper yet, using $ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: Luwify/ovgu-mensa
          ref: ${{ steps.ref.outputs.ref }}
          path: .mensa

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: .mensa/gradle/libs.versions.toml

      - name: Build the scraper
        working-directory: .mensa
        run: ./gradlew --no-daemon :scraper:installDist

      # Fails only when no Mensa could be fetched. One failing Mensa is a warning on the run page; pages without dishes
      # (closed, holidays) are a normal run with nothing to commit.
      - name: Scrape
        run: .mensa/scraper/build/install/scraper/bin/scraper --out data

      - name: Commit the data
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          git add data
          if ! git diff --cached --quiet; then
            git commit --quiet --message "Data: $(TZ=Europe/Berlin date +%F)"
            changed=true
          fi
          # A long gap without menus (holidays, site down): an ordinary commit is the activity GitHub surely counts.
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            date -u +%F > .keepalive
            git add .keepalive
            git commit --quiet --message "Keepalive"
          fi
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git pull --quiet --rebase origin main
            git push --quiet origin HEAD:main
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # A push with the job's token starts no other workflow, so the site is built from here.
  site:
    needs: scrape
    if: ${{ !cancelled() && needs.scrape.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      skip_browser_test: true
